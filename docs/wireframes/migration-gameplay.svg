<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      .screen { fill: #eef9fc; }
      .panel { fill: #ffffff; stroke: #84cde8; stroke-width: 4; }
      .map { fill: #fae8bc; stroke: #d4b87c; stroke-width: 5; }
      .tile { fill: #fffaf0; stroke: #d5bb84; stroke-width: 4; }
      .road { fill: #b5e782; stroke: #62b86e; stroke-width: 5; }
      .selected { fill: #b5ef79; stroke: #27c9df; stroke-width: 8; }
      .rock { fill: #b4a07e; stroke: #867254; stroke-width: 4; }
      .fog { fill: #ffffff; opacity: .7; }
      .path { fill: none; stroke: #28c9df; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #173954; font-family: sans-serif; font-weight: 700; text-anchor: middle; }
      .body { fill: #4e7087; font-family: sans-serif; font-weight: 500; text-anchor: middle; }
      .hint { fill: #39708d; font-family: sans-serif; font-weight: 600; }
    </style>
    <pattern id="map-grid" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M112 0 H0 V112" fill="none" stroke="#d9c18f" stroke-width="2"/>
    </pattern>
  </defs>

  <rect class="screen" width="1080" height="1920"/>

  <!-- Header: fixed and completely outside the map viewport. -->
  <rect class="panel" x="38" y="35" width="285" height="88" rx="34"/>
  <text class="title" x="180" y="92" font-size="38">绿洲边缘</text>

  <rect class="panel" x="345" y="35" width="215" height="88" rx="34"/>
  <text class="title" x="452" y="92" font-size="38">第 4 天</text>

  <circle class="panel" cx="998" cy="79" r="44"/>
  <text class="title" x="998" y="94" font-size="40">Ⅱ</text>

  <!-- Current-sum status: a compact strip, not an overlay on the map. -->
  <rect class="panel" x="265" y="145" width="550" height="112" rx="50"/>
  <text class="title" x="472" y="214" font-size="60">24 / 24</text>
  <line x1="645" y1="168" x2="645" y2="234" stroke="#c8dce5" stroke-width="3"/>
  <text class="body" x="723" y="210" font-size="32">可以开路</text>

  <!-- Large pannable map viewport. -->
  <rect class="map" x="38" y="290" width="1004" height="1288" rx="54"/>
  <rect x="65" y="317" width="950" height="1234" rx="36" fill="url(#map-grid)"/>
  <text class="hint" x="88" y="350" font-size="24">可平移地图视口</text>

  <!-- Fog is map background only. It never covers HUD, minimap, goals or tiles. -->
  <path class="fog" d="M65 317 H1015 V455 C890 415 770 470 650 430 C510 380 360 455 245 405 C170 375 115 390 65 405 Z"/>
  <path class="fog" d="M835 535 C930 500 1015 555 1015 735 C945 690 890 705 830 665 Z"/>

  <!-- Destination has a reserved upper-right zone. -->
  <circle cx="900" cy="575" r="74" fill="#72d18a" stroke="#ffffff" stroke-width="9"/>
  <text class="title" x="900" y="568" font-size="27">终点</text>
  <text class="body" x="900" y="604" font-size="23">绿洲</text>

  <!-- Minimap has its own safe box and does not overlap the destination. -->
  <rect class="panel" x="765" y="340" width="225" height="170" rx="28"/>
  <text class="body" x="877" y="372" font-size="22">小地图</text>
  <path d="M805 475 C825 455 830 425 855 415 S900 390 930 370" fill="none" stroke="#62b86e" stroke-width="15" stroke-linecap="round"/>
  <circle cx="805" cy="475" r="11" fill="#28bdd1"/>
  <circle cx="930" cy="370" r="11" fill="#f3aa31"/>

  <!-- Unopened number field. -->
  <g class="title" font-size="41">
    <rect class="tile" x="95" y="470" width="98" height="98" rx="24"/><text x="144" y="533">7</text>
    <rect class="tile" x="207" y="470" width="98" height="98" rx="24"/><text x="256" y="533">3</text>
    <rect class="tile" x="319" y="470" width="98" height="98" rx="24"/><text x="368" y="533">8</text>
    <rect class="tile" x="431" y="470" width="98" height="98" rx="24"/><text x="480" y="533">2</text>
    <rect class="tile" x="543" y="470" width="98" height="98" rx="24"/><text x="592" y="533">5</text>
    <rect class="tile" x="655" y="470" width="98" height="98" rx="24"/><text x="704" y="533">1</text>

    <rect class="tile" x="95" y="582" width="98" height="98" rx="24"/><text x="144" y="645">9</text>
    <rect class="tile" x="207" y="582" width="98" height="98" rx="24"/><text x="256" y="645">6</text>
    <rect class="tile" x="319" y="582" width="98" height="98" rx="24"/><text x="368" y="645">4</text>
    <rect class="tile" x="431" y="582" width="98" height="98" rx="24"/><text x="480" y="645">7</text>
    <rect class="tile" x="543" y="582" width="98" height="98" rx="24"/><text x="592" y="645">2</text>
    <rect class="tile" x="655" y="582" width="98" height="98" rx="24"/><text x="704" y="645">8</text>

    <rect class="tile" x="95" y="694" width="98" height="98" rx="24"/><text x="144" y="757">3</text>
    <rect class="tile" x="207" y="694" width="98" height="98" rx="24"/><text x="256" y="757">5</text>
    <rect class="rock" x="319" y="694" width="98" height="98" rx="32"/>
    <rect class="tile" x="431" y="694" width="98" height="98" rx="24"/><text x="480" y="757">6</text>
    <rect class="tile" x="543" y="694" width="98" height="98" rx="24"/><text x="592" y="757">1</text>
    <rect class="tile" x="655" y="694" width="98" height="98" rx="24"/><text x="704" y="757">4</text>

    <rect class="tile" x="95" y="806" width="98" height="98" rx="24"/><text x="144" y="869">6</text>
    <rect class="tile" x="207" y="806" width="98" height="98" rx="24"/><text x="256" y="869">2</text>
    <rect class="tile" x="319" y="806" width="98" height="98" rx="24"/><text x="368" y="869">9</text>
    <rect class="tile" x="431" y="806" width="98" height="98" rx="24"/><text x="480" y="869">3</text>
    <rect class="tile" x="543" y="806" width="98" height="98" rx="24"/><text x="592" y="869">4</text>
    <rect class="tile" x="655" y="806" width="98" height="98" rx="24"/><text x="704" y="869">7</text>
  </g>

  <!-- Existing connected road from the lower-left oasis to the active frontier. -->
  <g>
    <rect class="road" x="95" y="1398" width="98" height="98" rx="24"/>
    <rect class="road" x="207" y="1398" width="98" height="98" rx="24"/>
    <rect class="road" x="207" y="1286" width="98" height="98" rx="24"/>
    <rect class="road" x="319" y="1286" width="98" height="98" rx="24"/>
    <rect class="road" x="319" y="1174" width="98" height="98" rx="24"/>
    <rect class="road" x="431" y="1174" width="98" height="98" rx="24"/>
  </g>

  <circle cx="144" cy="1447" r="65" fill="#55c8e8" stroke="#ffffff" stroke-width="8"/>
  <text class="title" x="144" y="1442" font-size="24">起点</text>
  <text class="body" x="144" y="1473" font-size="20">绿洲</text>

  <!-- Animal group stands on the final old-road tile, below the new path. -->
  <circle cx="445" cy="1225" r="25" fill="#ffbf56" stroke="#ffffff" stroke-width="5"/>
  <circle cx="480" cy="1218" r="28" fill="#9ab2c4" stroke="#ffffff" stroke-width="5"/>
  <circle cx="515" cy="1225" r="25" fill="#e98567" stroke="#ffffff" stroke-width="5"/>
  <text class="body" x="610" y="1233" font-size="23">动物队伍</text>

  <!-- Current exact-24 path begins at the road frontier. -->
  <path class="path" d="M480 1111 L592 1111 L704 1111 L816 1111"/>
  <g class="title" font-size="41">
    <rect class="selected" x="431" y="1062" width="98" height="98" rx="24"/><text x="480" y="1125">6</text>
    <rect class="selected" x="543" y="1062" width="98" height="98" rx="24"/><text x="592" y="1125">5</text>
    <rect class="selected" x="655" y="1062" width="98" height="98" rx="24"/><text x="704" y="1125">4</text>
    <rect class="selected" x="767" y="1062" width="98" height="98" rx="24"/><text x="816" y="1125">9</text>
  </g>

  <!-- Instruction strip is outside the map, so it cannot cover the oasis or road. -->
  <rect class="panel" x="90" y="1602" width="900" height="76" rx="30"/>
  <text class="body" x="540" y="1650" font-size="25">道路或背景拖动：移动镜头　　数字格按住拖动：选择路径</text>

  <!-- Bottom controls: fixed safe area. -->
  <rect class="panel" x="190" y="1712" width="700" height="148" rx="66"/>
  <circle class="panel" cx="330" cy="1786" r="60"/>
  <circle class="panel" cx="540" cy="1786" r="60"/>
  <circle class="panel" cx="750" cy="1786" r="60"/>
  <text class="title" x="330" y="1804" font-size="48">◇</text>
  <text class="title" x="540" y="1804" font-size="48">↶</text>
  <text class="title" x="750" y="1804" font-size="48">◎</text>
  <text class="body" x="330" y="1888" font-size="23">罗盘</text>
  <text class="body" x="540" y="1888" font-size="23">撤回</text>
  <text class="body" x="750" y="1888" font-size="23">回到队伍</text>
</svg>
