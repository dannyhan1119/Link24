      .tile { fill: #ffffff; stroke: #b8ddea; stroke-width: 4; }
      .active { fill: #e5fbff; stroke: #28c8e8; stroke-width: 8; }
      .line { fill: none; stroke: #28c8e8; stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; }
      .primary { fill: #18304f; font-family: sans-serif; font-weight: 700; text-anchor: middle; }
      .secondary { fill: #66809c; font-family: sans-serif; font-weight: 500; text-anchor: middle; }
      .label { fill: #1b7798; font-family: sans-serif; font-weight: 700; text-anchor: middle; }
      .note { fill: #42657c; font-family: sans-serif; font-size: 26px; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1920"/>

  <rect class="panel" x="55" y="75" rx="36" ry="36" width="230" height="94"/>
